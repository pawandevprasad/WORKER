<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudinary Watermark Replacer (EstateX ➔ X)</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { margin-top: 0; color: #1e293b; font-size: 24px; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; }
        .grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; margin-top: 20px; }
        .panel { background: #f8fafc; padding: 18px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #475569; }
        input[type="text"], input[type="number"], input[type="color"] { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; }
        input[type="color"] { height: 40px; cursor: pointer; }
        .btn { width: 100%; background: #2563eb; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
        .btn:hover { background: #1d4ed8; }
        .btn-success { background: #16a34a; }
        .btn-success:hover { background: #15803d; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; max-height: 600px; overflow-y: auto; padding: 10px; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; }
        .card { border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px; text-align: center; background: white; }
        .card img { max-width: 100%; height: 140px; object-fit: cover; border-radius: 4px; }
        .card p { font-size: 11px; word-break: break-all; color: #64748b; margin: 8px 0; }
        .status { padding: 10px; background: #e0f2fe; color: #0369a1; border-radius: 6px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Cloudinary Watermark Replacer</h1>
    <div id="status" class="status"></div>

    <div class="grid">
        <!-- Controls -->
        <div class="panel">
            <h3>Settings</h3>
            <div class="form-group">
                <label>Naya Text:</label>
                <input type="text" id="newText" value="X">
            </div>
            <div class="form-group">
                <label>X Position (Pixels):</label>
                <input type="number" id="x1" value="50">
            </div>
            <div class="form-group">
                <label>Y Position (Pixels):</label>
                <input type="number" id="y1" value="50">
            </div>
            <div class="form-group">
                <label>Patch Width:</label>
                <input type="number" id="width" value="160">
            </div>
            <div class="form-group">
                <label>Patch Height:</label>
                <input type="number" id="height" value="50">
            </div>
            <div class="form-group">
                <label>Background Color (Patch):</label>
                <input type="color" id="bgColor" value="#ffffff">
            </div>
            <div class="form-group">
                <label>Text Color:</label>
                <input type="color" id="textColor" value="#000000">
            </div>
            
            <button class="btn btn-success" onclick="processAll()">Saari Images Change Karein</button>
        </div>

        <!-- Gallery -->
        <div>
            <h3>Cloudinary Images</h3>
            <div id="gallery" class="gallery">
                <p style="text-align:center;">Images load ho rahi hain...</p>
            </div>
        </div>
    </div>
</div>

<script>
    function showStatus(msg) {
        const s = document.getElementById('status');
        s.innerText = msg;
        s.style.display = 'block';
    }

    async function loadImages() {
        const res = await fetch('/api/resources');
        const data = await res.json();
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '';

        if(data.success && data.resources.length > 0) {
            data.resources.forEach(img => {
                const card = document.createElement('div');
                card.className = 'card';
                // URL me timestamp add kiya taaki browser caching bypass ho sake
                card.innerHTML = `
                    <img src="${img.secure_url}?t=${new Date().getTime()}" alt="img">
                    <p>${img.public_id}</p>
                    <button class="btn" onclick="processSingle('${img.public_id}')">Update This</button>
                `;
                gallery.appendChild(card);
            });
        } else {
            gallery.innerHTML = '<p>Koi images nahi mili.</p>';
        }
    }

    function getFormValues() {
        return {
            x1: document.getElementById('x1').value,
            y1: document.getElementById('y1').value,
            width: document.getElementById('width').value,
            height: document.getElementById('height').value,
            new_text: document.getElementById('newText').value,
            bg_color: document.getElementById('bgColor').value,
            text_color: document.getElementById('textColor').value
        };
    }

    async function processSingle(publicId) {
        showStatus('Processing image...');
        const payload = { public_id: publicId, ...getFormValues() };
        
        const res = await fetch('/api/process-image', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if(data.success) {
            showStatus('Image Successfully Update Ho Gayi!');
            loadImages();
        } else {
            showStatus('Error: ' + data.error);
        }
    }

    async function processAll() {
        if(!confirm("Kya aap sabhi images ka watermark badalna chahte hain?")) return;
        showStatus('Saari images process ho rahi hain, thoda wait karein...');
        
        const res = await fetch('/api/process-all', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(getFormValues())
        });
        const data = await res.json();
        if(data.success) {
            showStatus(data.message);
            loadImages();
        } else {
            showStatus('Error: ' + data.error);
        }
    }

    window.onload = loadImages;
</script>
</body>
</html>
