<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Automatic Watermark Remover</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; text-align: center; }
        .box { max-width: 500px; margin: 40px auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
        h1 { font-size: 22px; color: #38bdf8; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px; box-sizing: border-box; margin-bottom: 20px; }
        .btn { width: 100%; background: #2563eb; color: white; border: none; padding: 14px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #1d4ed8; }
        .status { margin-top: 20px; padding: 12px; border-radius: 6px; background: #0284c7; font-size: 14px; display: none; }
    </style>
</head>
<body>

<div class="box">
    <h1>AI Auto Watermark Remover</h1>
    <p style="font-size:13px; color:#94a3b8;">No coordinates needed. Auto-scans full account images.</p>
    
    <label style="display:block; text-align:left; font-size:12px; margin-bottom:5px; color:#cbd5e1;">Target Watermark Text:</label>
    <input type="text" id="targetText" value="EstateX">

    <button class="btn" id="startBtn" onclick="processAllAuto()">Start AI Bulk Cleaning</button>
    <div id="status" class="status"></div>
</div>

<script>
    async function processAllAuto() {
        const textVal = document.getElementById('targetText').value;
        const btn = document.getElementById('startBtn');
        const status = document.getElementById('status');

        if(!confirm(`Kya aap Cloudinary ke saare images me se '${textVal}' watermark auto-remove karna chahte hain?`)) return;

        btn.disabled = true;
        btn.innerText = "AI Processing Images... Please Wait";
        status.style.display = "block";
        status.innerText = "AI scanning and inpainting all images in your Cloudinary account...";

        try {
            const res = await fetch('/api/clean-all-auto', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ target_text: textVal })
            });

            const data = await res.json();
            if(data.success) {
                status.innerText = data.message;
            } else {
                status.innerText = "Error: " + data.error;
            }
        } catch(e) {
            status.innerText = "Processing error occurred.";
        } finally {
            btn.disabled = false;
            btn.innerText = "Start AI Bulk Cleaning";
        }
    }
</script>
</body>
</html>
